<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>용어집 — 업무 도움말 포털</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>

  <div class="demo-banner" role="note">
    이것은 <strong>가상 회사(누리금속)</strong>를 설정한 포트폴리오 견본입니다.
    실제 회사나 ERP 제품과 관계없습니다.
  </div>

  <header class="site-header">
    <a href="index.html" class="site-name" aria-label="업무 도움말 포털 홈">
      업무 도움말 포털
      <span class="site-name__tag">누리금속(가상)</span>
    </a>
    <button class="btn-icon btn-menu" id="btn-menu"
            aria-label="메뉴 열기" aria-expanded="false" aria-controls="sidebar">☰</button>
    <nav class="header-tools" aria-label="보기 설정">
      <button class="btn-icon" id="btn-search" aria-label="검색 열기 (단축키 /)">검색</button>
      <button class="btn-icon" id="btn-fieldmode" aria-label="현장 모드 켜기/끄기" aria-pressed="false">글자 크게</button>
      <button class="btn-icon" id="btn-darkmode" aria-label="다크 모드 켜기/끄기" aria-pressed="false">다크</button>
    </nav>
  </header>

  <div class="search-overlay" id="search-overlay" role="dialog" aria-modal="true" aria-label="검색" hidden>
    <div class="search-box">
      <label for="search-input" class="sr-only">검색어</label>
      <input id="search-input" type="search" placeholder="검색어를 입력하세요" autocomplete="off">
      <button class="btn-icon" id="btn-search-close" aria-label="검색 닫기">닫기</button>
    </div>
    <ul class="search-results" id="search-results" role="list" aria-live="polite"></ul>
  </div>

  <div class="page-wrap">
    <nav class="sidebar" id="sidebar" aria-label="모듈 메뉴">
      <button class="sidebar-close" id="btn-sidebar-close" aria-label="메뉴 닫기">닫기</button>
      <ul role="list">
        <li><a href="help/sales.html">영업 주문</a></li>
        <li><a href="help/purchase.html">구매 발주</a></li>
        <li><a href="help/inventory.html">재고 이동</a></li>
        <li><a href="help/approval.html">전자결재</a></li>
        <li class="sidebar-divider" role="separator"></li>
        <li><a href="glossary.html" aria-current="page">용어집</a></li>
        <li><a href="tools-page/contract.html">총량계약 현황</a></li>
        <li><a href="tools-page/subcontract.html">임가공 관리</a></li>
        <li><a href="admin/index.html">관리자 화면</a></li>
      </ul>
    </nav>

    <main class="main-content" id="main-content" tabindex="-1">
      <h1>용어집</h1>
      <p class="intro-text">도움말에 나오는 업무 용어를 정리했어요.
         도움말 본문에서 용어를 누르면 여기로 이동해요.</p>

      <div id="glossary-content"></div>
    </main>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/search.js"></script>
  <script>
  (function () {
    fetch('data/glossary.json')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.terms || !data.terms.length) {
          document.getElementById('glossary-content').innerHTML = '<p class="text-muted">용어가 아직 없어요.</p>';
          return;
        }
        var items = data.terms.map(function (t) {
          return '<dt id="' + (t.url ? t.url.split('#')[1] : '') + '">' +
            '<strong>' + t.term + '</strong></dt>' +
            '<dd>' + t.def + '</dd>';
        });
        document.getElementById('glossary-content').innerHTML =
          '<dl class="glossary-list">' + items.join('') + '</dl>';
      })
      .catch(function () {
        document.getElementById('glossary-content').textContent = '데이터를 불러오지 못했어요.';
      });
  })();
  </script>

  <style>
    .glossary-list { display: grid; grid-template-columns: auto 1fr; gap: var(--s1) var(--s4); align-items: baseline; }
    .glossary-list dt { font-size: 16px; padding: var(--s2) 0; border-top: 1px solid var(--border); }
    .glossary-list dd { padding: var(--s2) 0; border-top: 1px solid var(--border); font-size: 15px; color: var(--text-muted); margin: 0; }
    @media (max-width: 639px) {
      .glossary-list { grid-template-columns: 1fr; }
      .glossary-list dd { border-top: none; padding-top: 0; margin-bottom: var(--s2); }
    }
  </style>
</body>
</html>
